<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kaleya — Grace in Every Thread</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel+Decorative:wght@400&family=Raleway:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --green: #4b6846;
      --green-light: #6b8f62;
      --green-pale: #c8d8c2;
      --cream: #f5f0e8;
      --cream-dark: #ede8de;
      --text: #2c3a2a;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      background: var(--cream);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Raleway', sans-serif;
      position: relative;
    }

    /* Subtle textile-like background texture via SVG */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(74,103,65,0.03) 40px, rgba(74,103,65,0.03) 41px),
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(74,103,65,0.03) 40px, rgba(74,103,65,0.03) 41px);
      pointer-events: none;
      z-index: 0;
    }

    /* Decorative corner threads */
    .corner {
      position: fixed;
      width: 120px;
      height: 120px;
      opacity: 0.18;
    }
    .corner-tl { top: 0; left: 0; border-top: 1.5px solid var(--green); border-left: 1.5px solid var(--green); }
    .corner-tr { top: 0; right: 0; border-top: 1.5px solid var(--green); border-right: 1.5px solid var(--green); }
    .corner-bl { bottom: 0; left: 0; border-bottom: 1.5px solid var(--green); border-left: 1.5px solid var(--green); }
    .corner-br { bottom: 0; right: 0; border-bottom: 1.5px solid var(--green); border-right: 1.5px solid var(--green); }

    /* Floating needle decoration */
    .needle-decor {
      position: fixed;
      opacity: 0.07;
      pointer-events: none;
    }
    .needle-decor svg { fill: var(--green); }

    .wrapper {
      position: relative;
      z-index: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding: 2rem;
      max-width: 680px;
      width: 100%;
    }

    /* Logo */
    .logo-wrap {
      width: min(420px, 88vw);
      margin-bottom: 2rem;
      opacity: 0;
      transform: translateY(-18px);
      animation: fadeDown 1.2s cubic-bezier(0.22,1,0.36,1) 0.3s forwards;
    }
    .logo-wrap img {
      width: 100%;
      height: auto;
      filter: brightness(0) saturate(100%) invert(35%) sepia(18%) saturate(550%) hue-rotate(82deg) brightness(72%);
    }

    /* Thin divider line */
    .divider {
      width: 60px;
      height: 1px;
      background: var(--green-pale);
      margin: 0 auto 2.2rem;
      opacity: 0;
      animation: fadeIn 1s ease 1s forwards;
    }

    /* Main headline */
    .headline-wrap {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 1.1s cubic-bezier(0.22,1,0.36,1) 0.8s forwards;
      margin-bottom: 1.6rem;
    }

    .pre-text {
      font-family: 'Raleway', sans-serif;
      font-weight: 200;
      font-size: clamp(10px, 1.8vw, 13px);
      letter-spacing: 0.32em;
      color: var(--green-light);
      text-transform: uppercase;
      margin-bottom: 0.7rem;
    }

    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(42px, 9vw, 72px);
      color: var(--text);
      line-height: 1.05;
      letter-spacing: -0.01em;
    }

    .headline span {
      display: inline-block;
      position: relative;
    }

    /* Animated thread underline on headline */
    .headline span::after {
      content: '';
      position: absolute;
      bottom: 2px;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--green);
      animation: threadDraw 1.4s cubic-bezier(0.22,1,0.36,1) 1.6s forwards;
    }

    /* Subtext */
    .subtext {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(15px, 2.5vw, 19px);
      color: var(--green-light);
      letter-spacing: 0.06em;
      line-height: 1.7;
      opacity: 0;
      animation: fadeIn 1s ease 1.8s forwards;
      margin-bottom: 2.4rem;
    }

    /* Stitch dots */
    .stitches {
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      animation: fadeIn 1s ease 2.2s forwards;
      margin-bottom: 2.4rem;
    }
    .stitch {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--green-pale);
    }
    .stitch.active { background: var(--green); }



    /* Footer */
    .footer {
      position: fixed;
      bottom: 1.4rem;
      width: 100%;
      text-align: center;
      font-family: 'Raleway', sans-serif;
      font-weight: 200;
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--green-pale);
      opacity: 0;
      animation: fadeIn 1s ease 3s forwards;
    }
    .footer a {
      color: var(--green-pale);
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer a:hover { color: var(--green-light); }

    /* Animations */
    @keyframes fadeDown {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes threadDraw {
      to { width: 100%; }
    }

    /* Floating thread particles */
    .particle {
      position: fixed;
      width: 1px;
      background: var(--green);
      opacity: 0;
      border-radius: 1px;
      animation: floatThread linear infinite;
      pointer-events: none;
    }

    @keyframes floatThread {
      0%   { opacity: 0; transform: translateY(0) rotate(var(--rot)); }
      10%  { opacity: 0.18; }
      90%  { opacity: 0.10; }
      100% { opacity: 0; transform: translateY(-100vh) rotate(var(--rot)); }
    }
  </style>
</head>
<body>

  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <div class="wrapper">
    <div class="logo-wrap">
      <img src="Asset_1.png" alt="Kaleya" />
    </div>

    <div class="divider"></div>

    <div class="headline-wrap">
      <p class="pre-text">Something beautiful is being woven</p>
      <h1 class="headline"><span>Coming Soon</span></h1>
    </div>

    <p class="subtext">
      Every thread tells a story.<br/>
      Ours is almost ready to be worn.
    </p>

    <div class="stitches">
      <div class="stitch active"></div>
      <div class="stitch active"></div>
      <div class="stitch"></div>
      <div class="stitch"></div>
      <div class="stitch"></div>
      <div class="stitch"></div>
      <div class="stitch"></div>
    </div>


  </div>

  <div class="footer">
    <a href="https://kaleya.in">kaleya.in</a> &nbsp;·&nbsp; Grace in Every Thread
  </div>

  <script>


    // Floating thread particles
    const colors = ['#4a6741','#6b8f62','#c8d8c2'];
    for (let i = 0; i < 14; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const h = Math.random() * 60 + 20;
      p.style.cssText = `
        left: ${Math.random() * 100}vw;
        top: ${Math.random() * 100}vh;
        height: ${h}px;
        background: ${colors[Math.floor(Math.random()*3)]};
        --rot: ${(Math.random()-0.5)*30}deg;
        animation-duration: ${Math.random()*12+10}s;
        animation-delay: ${Math.random()*8}s;
      `;
      document.body.appendChild(p);
    }
  </script>
</body>
</html>
